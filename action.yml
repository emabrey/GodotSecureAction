name: GodotSecureAction

description: >
  Builds Godot Engine from source with custom pack encryption.
  Downloads the Godot Engine C++ source, applies the Godot Secure patch to
  replace the default AES-256 pack encryption with a uniquely keyed build
  using AES-256, Camellia-256, or ARIA-256, then compiles the editor and/or
  export templates. The resulting binaries replace the official Godot editor
  and export templates and work with any Godot project.

inputs:

  # ── Godot source ─────────────────────────────────────────────────────────────

  godot-version:
    description: >
      Godot version tag or branch to download (e.g. 4.6-stable, master).
      The source is downloaded automatically and placed at godot-source.
      Leave empty only if the source is already present in the workspace.
    default: '4.6-stable'

  godot-repo:
    description: GitHub repository to download Godot source from.
    default: 'godotengine/godot'

  godot-source:
    description: >
      Path where the Godot C++ source root is (or will be downloaded to),
      relative to the workspace. When godot-version is set the source is
      downloaded here automatically.
    default: 'godot-source'

  # ── Godot Secure patch ────────────────────────────────────────────────────────

  godot-secure-repo:
    description: >
      GitHub repository to download the Godot Secure release artifact from.
      Required — the action fails with a clear error if this is empty.
    default: 'emabrey/Godot-Secure'

  godot-secure-tag:
    description: Release tag to download the Godot Secure artifact from.
    default: 'v1.4.0'

  algorithm:
    description: >
      Cipher algorithm for the Godot Secure patch.
      Accepted values: aes, camellia, aria.
      All three produce AES-256-key-compatible binaries — the key format and
      length are the same; only the internal cipher used to encrypt the pack
      differs. You must use the same algorithm for every platform binary in a
      project distribution.
    default: 'aes'

  encryption-key:
    description: >
      64-character hexadecimal AES-256 encryption key. Store your key as a
      repository secret and pass it to this input from the calling workflow.
      If omitted, Godot Secure generates a random key for the build (recorded
      in the log artifact) — useful for one-off test builds.
    default: ''

  security-token:
    description: >
      64-character hex security token (32 bytes). The token is the single
      shared secret for a build: the pack magic headers and KDF formula are
      both derived from it deterministically via HKDF (RFC 5869) and
      byte-mapping, so no other security parameters need to be generated or
      passed separately. For multi-OS matrix builds, generate this once in a
      setup job and pass the same value to every build job.
    default: ''

  # ── Build ─────────────────────────────────────────────────────────────────────

  target:
    description: 'Build target(s) to compile. Accepted values: editor, template_debug, template_release, all.'
    default: 'all'

  platform:
    description: 'Target platform. Auto-detected when empty. Accepted values: linuxbsd, macos, windows'
    default: ''

  arch:
    description: 'Target architecture. Auto-detected when empty. Accepted values: x86_64, arm64'
    default: ''

  precision:
    description: 'Floating-point precision. Accepted values: single, double.'
    default: 'single'

  lto:
    description: 'Link-time optimisation level. Accepted values: none, auto, full.'
    default: 'auto'

  extra-scons-args:
    description: 'Additional SCons arguments. Example: "use_llvm=yes linker=mold"'
    default: ''

  scons-cache:
    description: Cache compiled SCons objects between runs to speed up incremental builds.
    default: 'true'

  scons-cache-limit:
    description: 'Maximum SCons cache size in GB. Godot prunes least-recently-used objects at build end to stay under the limit. 0 means unlimited.'
    default: '1'

  scons-cache-path:
    description: Path used for the SCons build cache directory.
    default: '.scons-cache'

  python-version:
    description: Python version used to run SCons and Godot Secure.
    default: '3.x'

outputs:

  algorithm:
    description: The cipher algorithm used for this build (aes, camellia, or aria).
    value: ${{ inputs.algorithm }}

  godot-source-path:
    description: Absolute path to the Godot source tree used for the build.
    value: ${{ steps.resolve-source.outputs.source-path }}

  godot-secure-script:
    description: Absolute path to the downloaded godot_secure.py.
    value: ${{ steps.fetch-godot-secure.outputs.script-path }}

  godot-version-string:
    description: >
      Version string for the Godot export_templates directory, e.g. "4.6.4.rc"
      or "4.6.0.stable". Append ".mono" when the build includes module_mono_enabled=yes.
      Use this to locate the correct templates directory without hardcoding versions.
    value: ${{ steps.locate-bins.outputs.godot-version-string }}

  editor-path:
    description: Absolute path to the compiled editor binary (if built).
    value: ${{ steps.locate-bins.outputs.editor-path }}

  template-debug-path:
    description: Absolute path to the compiled debug export template (if built).
    value: ${{ steps.locate-bins.outputs.template-debug-path }}

  template-release-path:
    description: Absolute path to the compiled release export template (if built).
    value: ${{ steps.locate-bins.outputs.template-release-path }}

author: Godot Secure
branding:
  icon: 'cpu'
  color: 'blue'

runs:
  using: 'composite'
  steps:

    # ── Input validation ────────────────────────────────────────────────────────
    # Fail immediately with a clear message rather than silently skipping steps
    # or producing an incompatible binary when required inputs are absent.

    - name: Validate required inputs
      shell: bash
      run: |
        ERRORS=0

        if [ -z "${{ inputs.godot-secure-repo }}" ]; then
          echo "::error::godot-secure-repo is required. " \
               "Set it to the GitHub repository that hosts godot_secure.py " \
               "(default: emabrey/Godot-Secure)."
          ERRORS=$((ERRORS + 1))
        fi

        if [ -z "${{ inputs.godot-secure-tag }}" ]; then
          echo "::error::godot-secure-tag is required. " \
               "Set it to the release tag to download godot_secure.py from " \
               "(default: v1.4.0)."
          ERRORS=$((ERRORS + 1))
        fi

        if [ -z "${{ inputs.algorithm }}" ]; then
          echo "::error::algorithm is required. Accepted values: aes, camellia, aria."
          ERRORS=$((ERRORS + 1))
        fi

        case "${{ inputs.algorithm }}" in
          aes|camellia|aria) ;;
          *)
            echo "::error::algorithm '${{ inputs.algorithm }}' is not valid. " \
                 "Accepted values: aes, camellia, aria."
            ERRORS=$((ERRORS + 1))
            ;;
        esac

        if [ -z "${{ inputs.encryption-key }}" ]; then
          echo "::warning::encryption-key is not set. " \
               "Godot Secure will generate a random key for this build — " \
               "check the log artifact for the generated key. " \
               "For reproducible project distributions, store a fixed key as a " \
               "repository secret and pass it via this input."
        fi

        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::$ERRORS required input(s) missing or invalid. See above."
          exit 1
        fi

    # ── Python + SCons ──────────────────────────────────────────────────────────

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SCons
      shell: bash
      run: pip install scons

    # ── Download Godot source ───────────────────────────────────────────────────
    # Always fetched fresh. The download is cheap (~15-40s) and the source tree
    # is not cached: caching it would only save that download while competing for
    # the repo's shared cache budget against the SCons object cache — which saves
    # minutes per build and is far more valuable per MB. Fetching fresh also
    # avoids serving a stale snapshot when godot-version points to a moving
    # branch (a branch HEAD advances, but a version-keyed cache would not).

    - name: Download Godot source
      if: inputs.godot-version != ''
      shell: bash
      run: |
        REF="${{ inputs.godot-version }}"
        REPO="${{ inputs.godot-repo }}"
        DEST="${{ inputs.godot-source }}"

        mkdir -p "$DEST"

        TAG_URL="https://github.com/${REPO}/archive/refs/tags/${REF}.tar.gz"
        STATUS=$(curl -s --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" -L "$TAG_URL")

        if [ "$STATUS" = "200" ]; then
          DOWNLOAD_URL="$TAG_URL"
          echo "Resolved '${REF}' as a release tag."
        else
          DOWNLOAD_URL="https://github.com/${REPO}/archive/refs/heads/${REF}.tar.gz"
          echo "Tag not found (HTTP ${STATUS}); resolving '${REF}' as a branch."
        fi

        echo "Downloading Godot source from ${DOWNLOAD_URL}"
        curl -fL --retry 5 --retry-delay 10 "$DOWNLOAD_URL" -o /tmp/godot-source.tar.gz
        tar -xz --strip-components=1 -C "$DEST" -f /tmp/godot-source.tar.gz
        rm /tmp/godot-source.tar.gz
        echo "Godot source downloaded to ${DEST}."

    # ── Resolve and validate the source path ────────────────────────────────────

    - name: Resolve Godot source path
      id: resolve-source
      shell: bash
      run: |
        # Use GITHUB_WORKSPACE explicitly rather than $(pwd) so the path is
        # always an absolute OS-native path regardless of working-directory.
        SOURCE_PATH="$GITHUB_WORKSPACE/${{ inputs.godot-source }}"
        if [ ! -f "$SOURCE_PATH/SConstruct" ]; then
          echo "::error::Godot source not found at ${SOURCE_PATH}. " \
               "Set godot-version to download it automatically, or verify " \
               "that godot-source points to an existing source tree."
          exit 1
        fi
        echo "source-path=$SOURCE_PATH" >> "$GITHUB_OUTPUT"
        echo "Godot source root: $SOURCE_PATH"

    # ── Download Godot Secure ───────────────────────────────────────────────────

    - name: Download Godot Secure script
      id: fetch-godot-secure
      shell: bash
      run: |
        REPO="${{ inputs.godot-secure-repo }}"
        TAG="${{ inputs.godot-secure-tag }}"
        URL="https://github.com/${REPO}/releases/download/${TAG}/godot_secure.py"

        echo "Downloading godot_secure.py from ${URL}"
        curl -fL --retry 5 --retry-delay 10 "$URL" -o "$GITHUB_WORKSPACE/godot_secure.py"

        SCRIPT_ABS="$GITHUB_WORKSPACE/godot_secure.py"
        echo "script-path=$SCRIPT_ABS" >> "$GITHUB_OUTPUT"
        echo "Downloaded to ${SCRIPT_ABS}."

    # ── Apply Godot Secure patch ────────────────────────────────────────────────
    # Masks the key before it appears in any log line, then passes it to the
    # script exclusively via the SCRIPT_AES256_ENCRYPTION_KEY environment
    # variable so it is never visible in the process argument list.

    - name: Apply Godot Secure (${{ inputs.algorithm }})
      shell: bash
      env:
        SCRIPT_AES256_ENCRYPTION_KEY: ${{ inputs.encryption-key }}
        GS_TOKEN: ${{ inputs.security-token }}
      run: |
        # Mask sensitive values before they can appear in any log line.
        [ -n "$SCRIPT_AES256_ENCRYPTION_KEY" ] && echo "::add-mask::$SCRIPT_AES256_ENCRYPTION_KEY"
        [ -n "$GS_TOKEN" ]                     && echo "::add-mask::$GS_TOKEN"

        ARGS=(
          --mode apply
          --algorithm "${{ inputs.algorithm }}"
          --non-interactive
        )

        # When a security token is provided, all derived parameters (KDF formula,
        # base-tag, enc-tag) are computed deterministically from it inside the
        # script via HKDF and byte-mapping — no extra arguments needed.
        [ -n "$GS_TOKEN" ] && ARGS+=(--token "$GS_TOKEN")

        python "$GITHUB_WORKSPACE/godot_secure.py" \
          "$GITHUB_WORKSPACE/${{ inputs.godot-source }}" \
          "${ARGS[@]}"

    # ── Platform system dependencies ────────────────────────────────────────────

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          libx11-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxi-dev \
          libxext-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libudev-dev \
          libdbus-1-dev \
          libfreetype-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libdecor-0-dev \
          pkg-config \
          yasm \
          gettext

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install molten-vk yasm

    - name: Install D3D12 SDK (Windows)
      if: runner.os == 'Windows'
      shell: bash
      working-directory: ${{ inputs.godot-source }}
      run: python misc/scripts/install_d3d12_sdk_windows.py

    # ── Resolve build parameters ────────────────────────────────────────────────
    # Runs before the SCons cache restore so the resolved platform and arch
    # values can be used in the cache key instead of the raw (possibly empty)
    # input values.

    - name: Resolve platform, arch, targets, and extra args
      id: params
      shell: bash
      run: |
        # ── Platform ────────────────────────────────────────────────────────────
        PLATFORM="${{ inputs.platform }}"
        if [ -z "$PLATFORM" ]; then
          case "${{ runner.os }}" in
            Linux)   PLATFORM="linuxbsd" ;;
            macOS)   PLATFORM="macos"    ;;
            Windows) PLATFORM="windows"  ;;
            *)
              echo "::error::Unsupported runner OS: ${{ runner.os }}"
              exit 1 ;;
          esac
        fi
        echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

        # ── Architecture ─────────────────────────────────────────────────────────
        # macOS: leave arch empty so SCons auto-detects the host (arm64 on
        # macos-latest / Apple Silicon, x86_64 on older Intel runners).
        # 'universal' is not a valid SCons arch value for Godot.
        ARCH="${{ inputs.arch }}"
        if [ -z "$ARCH" ]; then
          case "${{ runner.os }}" in
            Linux)   ARCH="x86_64" ;;
            macOS)   ARCH=""       ;;
            Windows) ARCH="x86_64" ;;
          esac
        fi
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

        # ── Targets ──────────────────────────────────────────────────────────────
        RAW_TARGET="${{ inputs.target }}"
        if [ "$RAW_TARGET" = "all" ]; then
          echo "targets=editor template_debug template_release" >> "$GITHUB_OUTPUT"
        else
          echo "targets=$RAW_TARGET" >> "$GITHUB_OUTPUT"
        fi

        # ── Platform-specific SCons args ─────────────────────────────────────────
        PLATFORM_ARGS=""
        case "${{ runner.os }}" in
          macOS)
            VULKAN_PATH="$(brew --prefix molten-vk)"
            PLATFORM_ARGS="vulkan_sdk_path=${VULKAN_PATH}"
            ;;
          Windows)
            # Build with clang (use_llvm) rather than MSVC. MSVC's default /Zi
            # debug model writes debug info to a separate shared PDB, so its .obj
            # files are not self-contained and SCons CacheDir cannot reuse them
            # across runs — measured at 0% hit rate, forcing a full ~2h rebuild
            # every time. clang embeds CodeView debug info in the object (like
            # gcc/clang on Linux/macOS, where the cache already works), which
            # raised the Windows cache hit rate to ~95% and cut the warm build
            # from ~2h to ~8min. d3d12=yes links fine under clang-cl.
            PLATFORM_ARGS="d3d12=yes use_llvm=yes"
            ;;
        esac
        echo "platform-args=$PLATFORM_ARGS" >> "$GITHUB_OUTPUT"

        # ── LTO ──────────────────────────────────────────────────────────────────
        # Normalise legacy bool aliases; pass none/auto/full through unchanged.
        LTO_VAL="${{ inputs.lto }}"
        [ "$LTO_VAL" = "true"  ] && LTO_VAL="full"
        [ "$LTO_VAL" = "false" ] && LTO_VAL="none"
        echo "lto-arg=lto=${LTO_VAL}" >> "$GITHUB_OUTPUT"

        # ── Cache path arg ────────────────────────────────────────────────────────
        # Use Python to resolve a native-OS absolute path so SCons and
        # actions/cache always refer to the same directory on every platform.
        # Bash string concatenation with $GITHUB_WORKSPACE produces mixed
        # separators on Windows (e.g. D:\a\repo/.scons-cache) because
        # $GITHUB_WORKSPACE holds a native backslash path on Windows runners.
        # When passed as a SCons cache_path= argument through Git Bash's MSYS2
        # layer, mixed separators can cause the cache directory to be resolved
        # differently by SCons vs. actions/cache.  os.path.abspath() always
        # returns the native OS format: D:\a\repo\.scons-cache on Windows,
        # /home/runner/work/repo/.scons-cache on Linux/macOS.
        if [ "${{ inputs.scons-cache }}" = "true" ]; then
          CACHE_ABS=$(python3 -c "import os; print(os.path.abspath('${{ inputs.scons-cache-path }}'))")
          echo "SCons cache path: ${CACHE_ABS}"
          echo "cache-arg=cache_path=${CACHE_ABS} cache_limit=${{ inputs.scons-cache-limit }}" >> "$GITHUB_OUTPUT"
          echo "cache-abs=${CACHE_ABS}" >> "$GITHUB_OUTPUT"
        else
          echo "cache-arg=" >> "$GITHUB_OUTPUT"
          echo "cache-abs=" >> "$GITHUB_OUTPUT"
        fi

    # ── SCons build cache ───────────────────────────────────────────────────────
    # Runs after params so the cache key uses the resolved platform and arch
    # rather than the raw (possibly empty) input values.

    # ── SCons cache: restore then always save ──────────────────────────────────
    # actions/cache (combined) skips the post-job save when the exact key hits,
    # so any objects compiled in that run are lost.  We split restore and save:
    #   • restore uses restore-keys so we always pick up the most recent cache
    #   • save appends algorithm + github.run_id so the key is unique per
    #     parallel job in the same run (prevents the "key already exists" failure
    #     that occurs when multiple cipher jobs race to write the same key)
    # Restore-keys fall back through same-cipher → any-cipher → broader prefix,
    # since most compiled objects are shared across cipher variants.
    # GitHub evicts LRU entries automatically once the 10 GB repo limit is hit.

    - name: Restore SCons cache
      if: inputs.scons-cache == 'true'
      id: scons-cache-restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ inputs.scons-cache-path }}
          ${{ inputs.godot-source }}/.sconsign.dblite
        key: >-
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{
          steps.params.outputs.platform }}-${{ steps.params.outputs.arch }}-${{
          inputs.precision }}-${{ runner.os }}-${{ inputs.algorithm }}-${{
          hashFiles(format('{0}/version.py', inputs.godot-source)) }}-${{ github.run_id }}
        restore-keys: |
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{ steps.params.outputs.platform }}-${{ steps.params.outputs.arch }}-${{ inputs.precision }}-${{ runner.os }}-${{ inputs.algorithm }}-${{ hashFiles(format('{0}/version.py', inputs.godot-source)) }}-
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{ steps.params.outputs.platform }}-${{ steps.params.outputs.arch }}-${{ inputs.precision }}-${{ runner.os }}-${{ inputs.algorithm }}-
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{ steps.params.outputs.platform }}-${{ steps.params.outputs.arch }}-${{ inputs.precision }}-${{ runner.os }}-
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{ steps.params.outputs.platform }}-${{ steps.params.outputs.arch }}-${{ runner.os }}-

    # ── Build ───────────────────────────────────────────────────────────────────

    - name: Build Godot
      shell: bash
      working-directory: ${{ inputs.godot-source }}
      run: |
        PLATFORM="${{ steps.params.outputs.platform }}"
        ARCH="${{ steps.params.outputs.arch }}"
        PRECISION="${{ inputs.precision }}"
        LTO_ARG="${{ steps.params.outputs.lto-arg }}"
        PLATFORM_ARGS="${{ steps.params.outputs.platform-args }}"
        CACHE_ARG="${{ steps.params.outputs.cache-arg }}"
        EXTRA="${{ inputs.extra-scons-args }}"

        ARCH_ARG=""
        [ -n "$ARCH" ] && ARCH_ARG="arch=$ARCH"

        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

        for TARGET in ${{ steps.params.outputs.targets }}; do
          echo "::group::SCons — platform=$PLATFORM target=$TARGET arch=$ARCH"
          scons \
            platform="$PLATFORM" \
            target="$TARGET" \
            precision="$PRECISION" \
            $ARCH_ARG \
            $LTO_ARG \
            $PLATFORM_ARGS \
            $CACHE_ARG \
            --implicit-cache \
            $EXTRA \
            -j"$JOBS"
          echo "::endgroup::"
        done

    # ── Locate compiled binaries and expose outputs ─────────────────────────────

    - name: Locate compiled binaries
      id: locate-bins
      shell: bash
      run: |
        PLATFORM="${{ steps.params.outputs.platform }}"
        BIN_DIR="$GITHUB_WORKSPACE/${{ inputs.godot-source }}/bin"

        locate_bin() {
          local pattern="$1"
          local result=""
          case "$PLATFORM" in
            macos)
              result=$(find "$BIN_DIR" -type f \( -name "*.macos.*" -o -name "Godot" \) 2>/dev/null \
                | grep -i "$pattern" | head -n 1)
              ;;
            windows)
              result=$(find "$BIN_DIR" -type f -name "*.exe" 2>/dev/null \
                | grep -v "console" | grep -i "$pattern" | head -n 1)
              ;;
            *)
              result=$(find "$BIN_DIR" -type f -executable 2>/dev/null \
                | grep -i "$pattern" | head -n 1)
              ;;
          esac
          echo "$result"
        }

        EDITOR_PATH=""
        DEBUG_PATH=""
        RELEASE_PATH=""

        for TARGET in ${{ steps.params.outputs.targets }}; do
          case "$TARGET" in
            editor)           EDITOR_PATH=$(locate_bin "editor")            ;;
            template_debug)   DEBUG_PATH=$(locate_bin "template_debug")     ;;
            template_release) RELEASE_PATH=$(locate_bin "template_release") ;;
          esac
        done

        echo "editor-path=$EDITOR_PATH"            >> "$GITHUB_OUTPUT"
        echo "template-debug-path=$DEBUG_PATH"     >> "$GITHUB_OUTPUT"
        echo "template-release-path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"

        # Emit the version string used for the export_templates directory,
        # e.g. "4.6.4.rc.mono" or "4.6.0.stable" (no .mono when built without
        # module_mono_enabled=yes — callers must append it when needed).
        VERSION_STR=$(python3 -c "
d = {}
exec(open('$GITHUB_WORKSPACE/${{ inputs.godot-source }}/version.py').read(), d)
print(f\"{d['major']}.{d['minor']}.{d['patch']}.{d['status']}\")" 2>/dev/null || echo "")
        echo "godot-version-string=$VERSION_STR" >> "$GITHUB_OUTPUT"
        [ -n "$VERSION_STR" ] && echo "  version string  : $VERSION_STR"

        echo "── Compiled binaries ──────────────────────────────────────────"
        [ -n "$EDITOR_PATH"   ] && echo "  editor          : $EDITOR_PATH"
        [ -n "$DEBUG_PATH"    ] && echo "  template_debug  : $DEBUG_PATH"
        [ -n "$RELEASE_PATH"  ] && echo "  template_release: $RELEASE_PATH"
        echo "───────────────────────────────────────────────────────────────"

    # ── Save SCons cache ────────────────────────────────────────────────────────
    # Uses always() so partially-compiled objects are persisted even when the
    # build fails — the next run can then reuse whatever was already compiled.
    # algorithm + run_id makes the key unique per parallel job.

    - name: Save SCons cache
      if: always() && inputs.scons-cache == 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ inputs.scons-cache-path }}
          ${{ inputs.godot-source }}/.sconsign.dblite
        key: >-
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{
          steps.params.outputs.platform }}-${{ steps.params.outputs.arch }}-${{
          inputs.precision }}-${{ runner.os }}-${{ inputs.algorithm }}-${{
          hashFiles(format('{0}/version.py', inputs.godot-source)) }}-${{ github.run_id }}
