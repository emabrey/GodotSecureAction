name: lld-link COMDAT crash repro

# One-off diagnostic workflow (manual dispatch only).
#
# Captures a self-contained reproducer for the lld-link / LTO-codegen crash
#   LLVM ERROR: Associative COMDAT symbol
#   '?tls_data@?$SafeBinaryMutex@$00@@0UTLSData@1@A' does not exist.
# (root cause: getComdatGVForCOFF in TargetLoweringObjectFileImpl.cpp -- the
# comdat leader is dropped/renamed under LTO, leaving a dangling associative
# comdat) on the windows-2025-vs2026 image (clang/lld-link 20.1.8).
#
# Findings so far:
#   * Trigger is full LTO of THIS module: the patched (Godot Secure) build with
#     lto=full crashes 9/9; vanilla Godot with lto=full links cleanly. The crash
#     is sensitive to symbol liveness (consistent with the comdat-leader-drop
#     root cause), so we reproduce with the patched build via the action.
#   * LLD_REPRODUCE makes lld-link write a complete input tarball (LTO bitcode +
#     libs + the exact response file) -- the self-contained reproducer to attach
#     to the LLVM issue.
#   * On a crash we also re-link with /threads:1 (rules a thread race out).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: patched lto=full #${{ matrix.n }}
    runs-on: windows-latest          # currently windows-2025-vs2026, clang 20.1.8
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]

    env:
      LLD_REPRODUCE: ${{ github.workspace }}\lld-repro\editor-link.tar

    steps:
      - name: Toolchain + image versions (for the bug report)
        shell: pwsh
        run: |
          "Image: $env:ImageOS  $env:ImageVersion"
          $lld = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin\lld-link.exe"
          if (Test-Path $lld) { & $lld --version; & (Join-Path (Split-Path $lld) 'clang-cl.exe') --version }

      - name: Build patched Godot editor, full LTO, capture lld reproduce
        id: build
        continue-on-error: true
        uses: emabrey/GodotSecureAction@v1
        with:
          godot-version:    4.6-stable
          algorithm:        aes
          target:           editor
          lto:              full
          scons-cache:      false        # fresh objects; the crash is deterministic here
          extra-scons-args: verbose=yes

      - name: On crash — re-link single-threaded (/threads:1) to test for a race
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $tar = $env:LLD_REPRODUCE
          if (-not (Test-Path $tar)) { "No reproduce tarball at $tar."; exit 0 }
          $dir = "repro-extract"; New-Item -ItemType Directory -Force $dir | Out-Null
          tar -xf $tar -C $dir
          $resp = Get-ChildItem $dir -Recurse -Filter 'response.txt' | Select-Object -First 1
          if (-not $resp) { "No response.txt inside the reproduce tarball."; exit 0 }
          $lld = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin\lld-link.exe"
          Push-Location $resp.Directory
          "=== re-link, default (threaded) ==="
          & $lld "@$($resp.Name)"; "exit (threaded): $LASTEXITCODE"
          "=== re-link, /threads:1 ==="
          & $lld "@$($resp.Name)" /threads:1; "exit (/threads:1): $LASTEXITCODE"
          Pop-Location

      - name: Upload reproducer (lld tarball + build output)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lld-repro-patched-lto-full-${{ matrix.n }}-${{ steps.build.outcome }}
          path: |
            ${{ github.workspace }}/lld-repro/**
            godot-source/bin/**
          if-no-files-found: warn
          retention-days: 14
