name: Build Godot Secure

# CI workflow — runs on every push to any branch to verify that
# GodotSecureAction works correctly across all cipher and OS combinations.
# Building on feature branches (e.g. ci/*) surfaces failures before they
# reach main.
#
# This workflow exercises the action itself. For the production release
# workflow that produces distributable artifacts, see release.yml.

on:
  workflow_dispatch:
  push:
    # '**' matches every branch, including namespaced names with a slash
    # such as ci/cross-platform-integration-tests.
    branches: ['**']

env:
  GODOT_VERSION:      '4.6-stable'
  GODOT_REPO:         'godotengine/godot'
  GODOT_SECURE_REPO:  'emabrey/Godot-Secure'
  GODOT_SECURE_TAG:   'v1.4.0'

permissions:
  contents: read

jobs:

  # ── Setup: generate the shared security token ─────────────────────────────────
  # Every build job must embed the same security token. The pack magic headers
  # and KDF formula are derived from it deterministically inside godot_secure.py,
  # so the token is the only value generated here. Generate it once and pass it
  # to every build job via needs outputs; if the token differed between jobs,
  # cross-platform PCK files would fail to open (mismatched magic header) or
  # decrypt to garbage (mismatched KDF formula).

  setup:
    name: Generate shared security parameters
    runs-on: ubuntu-latest

    outputs:
      security-token: ${{ steps.gen.outputs.security-token }}

    steps:
      - name: Download Godot Secure script
        run: |
          curl -fL --retry 5 --retry-delay 10 \
            "https://github.com/${{ env.GODOT_SECURE_REPO }}/releases/download/${{ env.GODOT_SECURE_TAG }}/godot_secure.py" \
            -o godot_secure.py

      - name: Generate security token
        id: gen
        run: python3 godot_secure.py --mode generate --non-interactive

  # ── Build matrix: 3 ciphers × 3 OSes = 9 parallel jobs ──────────────────────

  build:
    name: ${{ matrix.cipher }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [setup]

    strategy:
      fail-fast: false
      matrix:
        os:     [ubuntu-latest, macos-latest, windows-latest]
        cipher: [aes, camellia, aria]

    steps:
      - name: Build Godot Secure (${{ matrix.cipher }})
        id: godot-secure
        uses: emabrey/GodotSecureAction@v1
        with:
          godot-version:     ${{ env.GODOT_VERSION }}
          godot-repo:        ${{ env.GODOT_REPO }}
          godot-secure-repo: ${{ env.GODOT_SECURE_REPO }}
          godot-secure-tag:  ${{ env.GODOT_SECURE_TAG }}
          algorithm:         ${{ matrix.cipher }}
          encryption-key:    ${{ secrets.GODOT_ENCRYPTION_KEY }}
          security-token:    ${{ needs.setup.outputs.security-token }}
          target:            all
          scons-cache:       true
          # Windows now builds with clang by default (use_llvm) inside the
          # action itself — see the platform-args step in action.yml — so no
          # per-workflow override is needed here.

      - name: Upload Godot Secure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.cipher }}-${{ runner.os }}
          path: godot_secure_*.log
          if-no-files-found: warn

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: godot-secure-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/godot.*
          if-no-files-found: error

  # ── Editor-only build ─────────────────────────────────────────────────────────
  # Verifies the target=editor code path: editor-path output is populated,
  # template-debug-path and template-release-path are empty, and the startup
  # banner carries "(With Godot Secure)". Uses AES on Linux (cheapest build).

  build-editor-only:
    name: Build editor-only (AES / Linux)
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Build Godot Secure (editor only)
        id: godot-secure
        uses: emabrey/GodotSecureAction@v1
        with:
          godot-version:     ${{ env.GODOT_VERSION }}
          godot-repo:        ${{ env.GODOT_REPO }}
          godot-secure-repo: ${{ env.GODOT_SECURE_REPO }}
          godot-secure-tag:  ${{ env.GODOT_SECURE_TAG }}
          algorithm:         aes
          encryption-key:    ${{ secrets.GODOT_ENCRYPTION_KEY }}
          security-token:    ${{ needs.setup.outputs.security-token }}
          target:            editor
          scons-cache:       true

      - name: Upload Godot Secure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-editor-only-Linux
          path: godot_secure_*.log
          if-no-files-found: warn

      - name: Assert editor-path output is set and file exists
        run: |
          if [ -z "${{ steps.godot-secure.outputs.editor-path }}" ]; then
            echo "✗  FAIL — editor-path output is empty"
            exit 1
          fi
          if [ ! -f "${{ steps.godot-secure.outputs.editor-path }}" ]; then
            echo "✗  FAIL — editor-path points to a non-existent file: ${{ steps.godot-secure.outputs.editor-path }}"
            exit 1
          fi
          echo "✓  editor-path: ${{ steps.godot-secure.outputs.editor-path }}"

      - name: Assert template outputs are empty and no template binaries in bin/
        run: |
          FAIL=0
          if [ -n "${{ steps.godot-secure.outputs.template-debug-path }}" ]; then
            echo "✗  FAIL — template-debug-path should be empty, got: ${{ steps.godot-secure.outputs.template-debug-path }}"
            FAIL=1
          fi
          if [ -n "${{ steps.godot-secure.outputs.template-release-path }}" ]; then
            echo "✗  FAIL — template-release-path should be empty, got: ${{ steps.godot-secure.outputs.template-release-path }}"
            FAIL=1
          fi
          # Only inspect the top level of bin/: compiled binaries land directly
          # in bin/, while bin/obj/ holds SCons intermediate .o files and the
          # C++ core/templates source dir — neither of which are export
          # templates. -maxdepth 1 -type f avoids those false positives.
          TEMPLATES=$(find godot-source/bin -maxdepth 1 -type f -name "*template*" 2>/dev/null | head -5)
          if [ -n "$TEMPLATES" ]; then
            echo "✗  FAIL — unexpected template files found in bin/ when target=editor:"
            echo "$TEMPLATES"
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] && echo "✓  No template binaries present — correct for target=editor"
          exit "$FAIL"

      - name: Smoke test — startup banner contains "(With Godot Secure)"
        run: |
          BANNER=$("${{ steps.godot-secure.outputs.editor-path }}" --headless --quit 2>&1 || true)
          echo "Startup output:"
          echo "$BANNER"
          if echo "$BANNER" | grep -q "With Godot Secure"; then
            echo "✓  PASS — startup banner contains '(With Godot Secure)'"
          else
            echo "✗  FAIL — startup banner does not contain '(With Godot Secure)'"
            exit 1
          fi

  # ── Integration tests ─────────────────────────────────────────────────────────
  # Runs on every OS for every cipher (3 ciphers × 3 OSes = 9 jobs). Tests:
  #   1. Smoke test   — startup banner contains "(With Godot Secure)"
  #   2. Export test  — test project exports successfully under headless mode
  #   3. Magic header — exported PCK carries the token-derived base-tag, not the
  #                     default Godot magic (derivation is token-only, so the
  #                     same check works for all three ciphers)
  #   4. Anti-RE test — gdsdecomp cannot recover the embedded canary secret
  #
  # macOS and Windows jobs cross-export for the "Linux" preset: they run the
  # native OS editor but install the Linux export templates from the Linux
  # artifact. This tests that the native editor correctly encrypts a PCK while
  # avoiding the complexity of packaging macOS .app bundles or Windows installers
  # just for the integration test. Cross-platform PCK loading is a separate
  # future test.

  integration-test:
    name: Integration tests (${{ matrix.cipher }} / ${{ matrix.os }})
    needs: [setup, build]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        cipher: [aes, camellia, aria]
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      TEST_SECRET: "gs_secret_tk9v2x8m4p7n1q3r5w"
      # Force Python into UTF-8 mode (PEP 540). Windows runners default to a
      # legacy console codepage (cp1252) that cannot encode the ✓/✗ characters
      # in the test scripts' output and misdecodes subprocess output.
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ${{ matrix.cipher }} ${{ runner.os }} bundle
        uses: actions/download-artifact@v7
        with:
          name: godot-secure-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-bundle/

      # macOS and Windows use the Linux export templates for the cross-export.
      - name: Download Linux bundle for export templates
        if: runner.os != 'Linux'
        uses: actions/download-artifact@v7
        with:
          name: godot-secure-${{ matrix.cipher }}-Linux
          path: godot-bundle-linux/

      - name: Make binaries executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x godot-bundle/*
          # godot-bundle-linux only exists on macOS (cross-export). Use an if
          # block, not `[ -d ] && chmod`: the latter is the step's last command,
          # so on Linux (dir absent) it returns 1 and fails the bash -e step.
          if [ -d godot-bundle-linux ]; then
            chmod +x godot-bundle-linux/*
          fi

      - name: Locate editor binary
        id: editor
        shell: bash
        run: |
          # -perm -u+x, not -executable: the latter is a GNU find extension that
          # macOS/BSD find does not support. Both finds accept -perm -u+x, and
          # the prior chmod step guarantees the bit is set (artifact download
          # does not preserve Unix exec permissions).
          case "${{ runner.os }}" in
            Windows) BIN=$(find godot-bundle -type f -name "*editor*.exe" | head -1) ;;
            *)       BIN=$(find godot-bundle -type f -perm -u+x -name "*editor*" | head -1) ;;
          esac
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Found editor: $BIN"

      # ── Test 1: smoke test ─────────────────────────────────────────────────
      # Godot Secure patches version.py's `name` field, which appears in the
      # startup banner ("Godot Engine (With Godot Secure) v4.6.stable...").
      # --version only outputs the semver number; use --headless --quit to
      # capture the full startup output that contains the engine name instead.

      - name: Smoke test — startup banner contains "(With Godot Secure)"
        shell: bash
        run: |
          BANNER=$("${{ steps.editor.outputs.path }}" --headless --quit 2>&1 || true)
          echo "Startup output:"
          echo "$BANNER"
          if echo "$BANNER" | grep -q "With Godot Secure"; then
            echo "✓  PASS — startup banner contains '(With Godot Secure)'"
          else
            echo "✗  FAIL — startup banner does not contain '(With Godot Secure)'"
            exit 1
          fi

      # ── Install export templates ───────────────────────────────────────────
      # Always installs Linux templates. On Linux, the source is godot-bundle/;
      # on macOS and Windows, the Linux templates come from godot-bundle-linux/.
      # The template directory path differs per OS.

      - name: Install Linux export templates
        shell: bash
        run: |
          TMPL_VERSION=$(echo "${{ env.GODOT_VERSION }}" | tr '-' '.')

          case "${{ runner.os }}" in
            Linux)
              TMPL_DIR="$HOME/.local/share/godot/export_templates/$TMPL_VERSION"
              SRC_DIR="godot-bundle"
              ;;
            macOS)
              TMPL_DIR="$HOME/Library/Application Support/Godot/export_templates/$TMPL_VERSION"
              SRC_DIR="godot-bundle-linux"
              ;;
            Windows)
              TMPL_DIR="$APPDATA/Godot/export_templates/$TMPL_VERSION"
              SRC_DIR="godot-bundle-linux"
              ;;
          esac

          mkdir -p "$TMPL_DIR"

          DEBUG=$(find "$SRC_DIR" -type f -name "*template_debug*" | head -1)
          RELEASE=$(find "$SRC_DIR" -type f -name "*template_release*" | head -1)

          cp "$DEBUG"   "$TMPL_DIR/linux_debug.x86_64"
          cp "$RELEASE" "$TMPL_DIR/linux_release.x86_64"

          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "$TMPL_DIR"/*.x86_64
          fi

          echo "Installed templates to: $TMPL_DIR"
          ls -lh "$TMPL_DIR/"

      # ── Test 2: headless export ────────────────────────────────────────────

      - name: Export test project
        shell: bash
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_ENCRYPTION_KEY }}
        run: |
          mkdir -p test/project/exported
          "${{ steps.editor.outputs.path }}" \
            --headless \
            --path test/project \
            --export-release "Linux" \
            exported/test.pck
          ls -lh test/project/exported/

      # ── Test 3: magic header check ─────────────────────────────────────────

      - name: Verify PCK magic header matches expected base-tag
        shell: bash
        run: python3 test/scripts/check_magic_header.py test/project/exported/test.pck "${{ needs.setup.outputs.security-token }}"

      # ── Test 4: reverse engineering resistance ─────────────────────────────

      - name: Download gdsdecomp
        shell: bash
        env:
          # Authenticate the GitHub API call. Unauthenticated requests are
          # capped at 60/hour per runner IP, which the 9-job integration matrix
          # exhausts (intermittent 403s on releases/latest). GITHUB_TOKEN raises
          # the limit to 15000/hour and scopes it to the repo, not the shared IP.
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNNER_OS="${{ runner.os }}"
          RELEASE_JSON=$(curl -fsSL --retry 5 --retry-delay 10 \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/bruvzg/gdsdecomp/releases/latest)

          echo "Available gdsdecomp release assets:"
          echo "$RELEASE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data['assets']:
              print(' ', a['name'])
          "

          ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          runner_os = '$RUNNER_OS'

          def matches_os(name):
              n = name.lower()
              if runner_os == 'Linux':
                  return ('linux' in n or 'lin' in n) and 'darwin' not in n
              elif runner_os == 'macOS':
                  return 'mac' in n or 'osx' in n or 'macos' in n or 'darwin' in n
              else:  # Windows
                  return 'win' in n and 'darwin' not in n and 'linux' not in n

          for ext in ('.zip', '.tar.gz', '.tar.xz'):
              for a in assets:
                  if matches_os(a['name']) and a['name'].lower().endswith(ext):
                      print(a['browser_download_url'])
                      sys.exit(0)
          ")

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: no $RUNNER_OS archive found in the latest gdsdecomp release."
            echo "Check https://github.com/bruvzg/gdsdecomp/releases/latest for available assets."
            exit 1
          fi
          echo "Downloading gdsdecomp from: $ASSET_URL"

          case "$ASSET_URL" in
            *.tar.gz)  curl -fL --retry 5 --retry-delay 10 "$ASSET_URL" -o gdsdecomp.tar.gz
                       mkdir -p gdsdecomp && tar -xzf gdsdecomp.tar.gz -C gdsdecomp/ ;;
            *.tar.xz)  curl -fL --retry 5 --retry-delay 10 "$ASSET_URL" -o gdsdecomp.tar.xz
                       mkdir -p gdsdecomp && tar -xJf gdsdecomp.tar.xz -C gdsdecomp/ ;;
            *)         curl -fL --retry 5 --retry-delay 10 "$ASSET_URL" -o gdsdecomp.zip
                       unzip -q gdsdecomp.zip -d gdsdecomp/ ;;
          esac

          find gdsdecomp/ -type f | xargs chmod +x 2>/dev/null || true
          echo "gdsdecomp contents:"
          find gdsdecomp/ -type f

      - name: Reverse engineering resistance test
        shell: bash
        run: |
          python3 test/scripts/test_reverse_engineering.py \
            --pck    test/project/exported/test.pck \
            --tool   gdsdecomp/ \
            --secret "${{ env.TEST_SECRET }}"

  # ── Package: merge per-OS bundles into one artifact per cipher ────────────────
  # Only runs when integration tests pass.

  package:
    name: Package (${{ matrix.cipher }})
    needs: [build, integration-test, build-editor-only]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cipher: [aes, camellia, aria]

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v7
        with:
          name: godot-secure-${{ matrix.cipher }}-Linux
          path: release/linux/

      - name: Download macOS binaries
        uses: actions/download-artifact@v7
        with:
          name: godot-secure-${{ matrix.cipher }}-macOS
          path: release/macos/

      - name: Download Windows binaries
        uses: actions/download-artifact@v7
        with:
          name: godot-secure-${{ matrix.cipher }}-Windows
          path: release/windows/

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: godot-secure-${{ matrix.cipher }}
          path: release/
          if-no-files-found: error
